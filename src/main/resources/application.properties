spring.application.name=order-inventory
server.address=127.0.0.1
server.port=${APP_PORT:18080}
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:13306/order_inventory?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${DB_USER:order_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=24
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.data-source-properties.connectTimeout=3000
spring.datasource.hikari.data-source-properties.socketTimeout=8000
spring.datasource.hikari.connection-init-sql=SET SESSION innodb_lock_wait_timeout=5
spring.flyway.locations=classpath:db/migration
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.error.include-message=never
server.error.include-stacktrace=never
